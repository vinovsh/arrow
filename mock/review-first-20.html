<style>
  #arrow-review-20 {
    font-family: system-ui, sans-serif;
    color: #17273b;
    background: #fff;
    border-radius: 18px;
    max-width: 620px;
    margin: auto;
    padding: 16px;
    box-sizing: border-box;
  }
  #arrow-review-20 .review-chrome {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  #arrow-review-20 button,
  #arrow-review-20 select {
    font: inherit;
    background: #f1f5f9;
    color: #17273b;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 10px;
    min-height: 44px;
  }
  #arrow-review-20 label {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #arrow-review-20 .review-title {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
    font-weight: 500;
  }
  #arrow-review-20 #arrow-band {
    color: #476077;
  }
  #arrow-review-20 svg {
    width: 100%;
    display: block;
    touch-action: manipulation;
    overflow: hidden;
  }
  #arrow-review-20 #arrow-status {
    min-height: 24px;
    color: #476077;
  }
  #arrow-review-20 .arrow-target {
    cursor: pointer;
  }

    movementAudio.volume = 0.65;
    function whoosh() {
      if (sound) {
        const voice = movementAudio.cloneNode();
        voice.volume = 0.65;
        voice.play().catch(() => {});
      }
    }
    function update() {
      status.textContent =
        removed.size === level.arrows.length
          ? 'Level cleared!'
          : level.arrows.length -
            removed.size +
            ' arrows remaining · Tap an arrow to move it';
    }
    function move(i, g, body, head) {
      if (removed.has(i) || moving.has(i)) return;
      if (!free(i)) {
        g.setAttribute('color', '#c2414b');
        status.textContent = 'Blocked — clear the arrow in front first';
        setTimeout(() => g.setAttribute('color', '#17273b'), 400);
        return;
      }
      removed.add(i);
      moving.add(i);
      g.setAttribute('color', '#008ca8');
      whoosh();
      update();
      const token = epoch,
        start = performance.now(),
        duration = matchMedia('(prefers-reduced-motion: reduce)').matches
          ? 1
          : Math.min(460, 280 + level.arrows[i].cells.length * 6);
      function frame(now) {
        if (token !== epoch) return;
        const t = Math.min(1, (now - start) / duration),
          p = geometry(level.arrows[i], t);
        body.setAttribute('d', p.body);
        head.setAttribute('d', p.head);
        if (t < 1) requestAnimationFrame(frame);
        else {
          g.remove();
          moving.delete(i);
        }
      }
      requestAnimationFrame(frame);
    }
    function load() {
      epoch++;
      level = levels.find(l => l.id === Number(select.value)) || levels[0];
      removed = new Set();
      moving = new Set();
      svg.replaceChildren();
      root.querySelector('#arrow-title').textContent = level.title;
      root.querySelector('#arrow-band').textContent = level.tier;
      level.arrows.forEach((a, i) => {
        const p = geometry(a),
          g = document.createElementNS(NS, 'g'),
          body = document.createElementNS(NS, 'path'),
          head = document.createElementNS(NS, 'path'),
          hit = document.createElementNS(NS, 'path');
        g.setAttribute('color', '#17273b');
        g.setAttribute('class', 'arrow-target');
        g.dataset.arrow = i;
        body.setAttribute('d', p.body);
        body.setAttribute('fill', 'none');
        body.setAttribute('stroke', 'currentColor');
        body.setAttribute('stroke-width', p.sw);
        body.setAttribute('stroke-linecap', 'round');
        body.setAttribute('stroke-linejoin', 'round');
        head.setAttribute('d', p.head);
        head.setAttribute('fill', 'currentColor');
        hit.setAttribute('d', p.body);
        hit.setAttribute('stroke', 'transparent');
        hit.setAttribute('stroke-width', Math.max(12, p.sw * 2));
        hit.setAttribute('fill', 'none');
        g.append(body, head, hit);
        g.addEventListener('click', () => move(i, g, body, head));
        svg.append(g);
      });
      update();
    }
    select.addEventListener('change', load);
    root.querySelector('#arrow-reset').addEventListener('click', load);
    root.querySelector('#arrow-hint').addEventListener('click', () => {
      const i = level.arrows.findIndex((a, j) => !removed.has(j) && free(j));
      if (i >= 0) {
        const g = svg.querySelector('[data-arrow="' + i + '"]');
        g.setAttribute('color', '#008ca8');
        status.textContent = 'Highlighted arrow has a clear exit';
      }
    });
    root.querySelector('#arrow-sound').addEventListener('click', e => {
      sound = !sound;
      e.target.textContent = sound ? 'Sound on' : 'Sound off';
      e.target.setAttribute('aria-pressed', String(sound));
      if (sound) whoosh();
    });
    select.value = '8';
    load();
  })();
