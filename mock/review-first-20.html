    function whoosh() {
      if (sound) {
        const voice = movementAudio.cloneNode();
        voice.volume = 0.65;
        voice.play().catch(() => {});
      }
    }
    function update() {
      status.textContent =
        removed.size === level.arrows.length
          ? 'Level cleared!'
          : level.arrows.length -
            removed.size +
            ' arrows remaining · Tap an arrow to move it';
      updateTutorialGuide();
    }
    function updateTutorialGuide() {
      svg.querySelector('[data-tutorial-guide]')?.remove();
      if (level.id !== 1) return;
      const index = level.arrows.findIndex(
        (a, i) => !removed.has(i) && free(i),
      );
      root.querySelector('#arrow-guide').hidden = index < 0;
      if (index < 0) return;
      const arrow = level.arrows[index],
        cell = 420 / level.gridSize;
      const x = (arrow.cells[2][0] + 0.5) * cell,
        y = cell * 9.3;
      const left = Math.max(0, Math.min(244, x - 88));
      svg
        .querySelector('[data-arrow="' + index + '"]')
        .setAttribute('color', '#008ca8');
      const group = document.createElementNS(NS, 'g');
      group.dataset.tutorialGuide = '';
      group.setAttribute('pointer-events', 'none');
      const rect = document.createElementNS(NS, 'rect');
      for (const [k, v] of Object.entries({
        x: left,
        y,
        width: 176,
        height: 50,
        rx: 14,
        fill: '#008ca8',
      }))
        rect.setAttribute(k, v);
      const pointer = document.createElementNS(NS, 'polygon');
      pointer.setAttribute(
        'points',
        `${x - 10},${y + 1} ${x},${y - 10} ${x + 10},${y + 1}`,
      );
      pointer.setAttribute('fill', '#008ca8');
      const text = document.createElementNS(NS, 'text');
      for (const [k, v] of Object.entries({
        x: left + 88,
        y: y + 31,
        'text-anchor': 'middle',
        'font-size': 18,
        fill: 'white',
      }))
        text.setAttribute(k, v);
      text.textContent = 'Tap to remove';
      group.append(rect, pointer, text);
      svg.append(group);
    }
    function move(i, g, body, head) {
      if (removed.has(i) || moving.has(i)) return;
      if (!free(i)) {
        g.setAttribute('color', '#c2414b');
        status.textContent = 'Blocked — clear the arrow in front first';
        setTimeout(() => g.setAttribute('color', '#17273b'), 400);
        return;
      }
      root.querySelector('#arrow-guide').hidden = true;
      root.querySelector('#arrow-play-hint').hidden = true;
      removed.add(i);
      moving.add(i);
      g.setAttribute('color', '#008ca8');

          p = geometry(level.arrows[i], t);

        head.setAttribute('d', p.head);

          g.remove();
          moving.delete(i);
        }

      requestAnimationFrame(frame);

    function load() {
      epoch++;
      level = levels.find(l => l.id === Number(select.value)) || levels[0];

      moving = new Set();
      root.querySelector('#arrow-play-hint').hidden = true;
      svg.replaceChildren();
      root.querySelector('#arrow-title').textContent = level.title;
      root.querySelector('#arrow-band').textContent = level.tier;

          body = document.createElementNS(NS, 'path'),
          head = document.createElementNS(NS, 'path'),

        g.dataset.arrow = i;
        body.setAttribute('d', p.body);
        body.setAttribute('fill', 'none');
        body.setAttribute('stroke', 'currentColor');
        body.setAttribute('stroke-width', p.sw);
        body.setAttribute('stroke-linecap', 'round');
        body.setAttribute('stroke-linejoin', 'round');
        head.setAttribute('d', p.head);
        head.setAttribute('fill', 'currentColor');
        hit.setAttribute('d', p.body);
        hit.setAttribute('stroke', 'transparent');
        hit.setAttribute(
          'stroke-width',
          Math.min((420 / level.gridSize) * 0.8, Math.max(8, p.sw * 2)),
        );
        hit.setAttribute('fill', 'none');
        g.append(body, head, hit);
        g.addEventListener('click', () => move(i, g, body, head));
        svg.append(g);

      update();
      fit();
      root.querySelector('#arrow-guide').hidden = level.id !== 1;
      if (level.id === 1) {
        const first = level.arrows.findIndex((a, i) => free(i));
        svg
          .querySelector('[data-arrow="' + first + '"]')
          .setAttribute('color', '#008ca8');
      }
    }
    let zoom = 1,
      panX = 0,
      panY = 0,
      drag = null,
      dragged = false;
    function view() {
      const side = 460 / zoom,
        limit = (460 - side) / 2;
      panX = Math.max(-limit, Math.min(limit, panX));
      panY = Math.max(-limit, Math.min(limit, panY));
      svg.setAttribute(
        'viewBox',
        [210 - side / 2 + panX, 210 - side / 2 + panY, side, side].join(' '),
      );
      root.querySelector('#arrow-zoom').textContent =
        zoom >= 3 ? 'Zoom out' : 'Zoom in';
    }
    function fit() {
      zoom = 1;
      panX = panY = 0;
      view();
    }
    root.querySelector('#arrow-zoom').addEventListener('click', () => {
      zoom = zoom >= 3 ? 1 : zoom + 1;
      view();
    });
    root.querySelector('#arrow-fit').addEventListener('click', fit);
    svg.addEventListener('pointerdown', e => {
      drag = {x: e.clientX, y: e.clientY, px: panX, py: panY};
      dragged = false;
    });
    svg.addEventListener('pointermove', e => {
      if (!drag || zoom === 1) return;
      const dx = e.clientX - drag.x,
        dy = e.clientY - drag.y;
      if (Math.hypot(dx, dy) > 8) dragged = true;
      if (dragged) {
        svg.setPointerCapture(e.pointerId);

        panY = drag.py - dy * ratio;
        view();
      }
    });
    svg.addEventListener('pointerup', () => {
      drag = null;
    });
    svg.addEventListener('pointercancel', () => {
      drag = null;
    });

      'click',
      e => {
        if (dragged) {
          e.stopPropagation();
          dragged = false;
        }
      },
      true,
    );

    root.querySelector('#arrow-reset').addEventListener('click', load);
    root.querySelector('#arrow-hint').addEventListener('click', () => {
      const i = level.arrows.findIndex((a, j) => !removed.has(j) && free(j));
      if (i >= 0) {
        const g = svg.querySelector('[data-arrow="' + i + '"]');
        g.setAttribute('color', '#008ca8');
        status.textContent = 'Highlighted arrow has a clear exit';
        root.querySelector('#arrow-play-hint').hidden = false;
        root.querySelector('#arrow-play-hint').onclick = () =>
          g.dispatchEvent(new Event('click'));
      }
    });
    root.querySelector('#arrow-sound').addEventListener('click', e => {
      sound = !sound;
      e.target.textContent = sound ? 'Sound on' : 'Sound off';
      e.target.setAttribute('aria-pressed', String(sound));
      if (sound) whoosh();
    });
    select.value = '1';
    load();
  })();
